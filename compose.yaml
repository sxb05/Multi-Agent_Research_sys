services:
  research-lab:
    build:
      context: .
      dockerfile: Dockerfile
    image: research-lab:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
      WEB_CONCURRENCY: "2"
    ports:
      - "8000:8000"
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
